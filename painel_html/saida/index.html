<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance do PCP - Moldara Embalagens</title>
<style>
:root{
  color-scheme:dark;
  /* paleta do painel: petroleo #078CA9, ciano #53D1EC, branco #F2F2F2, lima #C5DF16 e #DDF156 sobre fundo #0F5160 */
  --plano:#0F5160; --sup:#0A4250; --tinta:#F2F2F2; --tinta2:#A9D3DC; --mudo:#6FA9B5;
  --grade:#1C6E7E; --eixo:#2B7585; --borda:rgba(242,242,242,.08);
  --faixa:#0A4250; --faixa2:#14606F; --fita:#C5DF16;
  --s1:#53D1EC; --s1f:#078CA9; --s2:#C5DF16; --s4:#DDF156; --s7:#F2F2F2; --n1:#2B7585; --n2:#14606F;
  --ok:#C5DF16; --alerta:#F2F2F2; --critico:#FF7A6B;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--plano);color:var(--tinta);font:15px/1.45 Bahnschrift,"DIN Alternate","Segoe UI",system-ui,sans-serif}
button,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.topo{background:var(--faixa);color:#fff}
.topo-in{max-width:1320px;margin:0 auto;padding:18px 20px 14px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.topo .marca{font-size:13px;color:var(--fita);letter-spacing:.4px}
.topo h1{font-size:26px;font-weight:600;letter-spacing:.2px;line-height:1.15}
.topo p{color:var(--tinta2);font-size:14px;margin-top:3px}
.fita{height:6px;background:repeating-linear-gradient(135deg,var(--fita) 0 14px,var(--sup) 14px 28px)}
.filtros{display:flex;flex-wrap:wrap;gap:10px 18px}
.grupo{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--tinta2)}
.seg{display:flex;flex-wrap:wrap;background:var(--faixa2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--tinta2);padding:5px 11px;border-radius:6px;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--fita);color:#0A4250;font-weight:600}
.seg button:focus-visible,.abas button:focus-visible{outline:2px solid var(--fita);outline-offset:2px}
.abas{background:var(--sup);border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:5}
.abas-in{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.abas button{border:0;background:none;padding:12px 12px 10px;cursor:pointer;color:var(--tinta2);white-space:nowrap;border-bottom:3px solid transparent;font-size:15px}
.abas button[aria-selected=true]{color:var(--tinta);font-weight:600;border-bottom-color:var(--fita)}
main{max-width:1320px;margin:0 auto;padding:18px 20px 60px}
.linha{display:grid;gap:14px;margin-bottom:14px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.c12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.c6{grid-template-columns:repeat(6,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.c6{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.c2,.c3,.c21,.c12{grid-template-columns:minmax(0,1fr)}.c6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cartao{background:var(--sup);border:1px solid var(--borda);border-radius:10px;padding:16px 16px 14px;min-width:0}
.cartao h2{font-size:16.5px;font-weight:600}
.cartao .sub{color:var(--tinta2);font-size:13.5px;margin:2px 0 12px}
.tile{padding:13px 14px 11px}
.tile .rot{font-size:13.5px;color:var(--tinta2)}
.tile .val{font-size:31px;font-weight:600;line-height:1.15;margin-top:2px}
.tile .val small{font-size:15px;font-weight:400;color:var(--tinta2);margin-left:3px}
.tile .pe{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;margin-top:6px}
.tile .meta{font-size:12.5px;color:var(--mudo);white-space:nowrap}
.tile .delta{font-size:12.5px;color:var(--tinta2);margin-top:3px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--tinta);white-space:nowrap}
.st i{font-style:normal;width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#0A4250}
.st-ok i{background:var(--ok)}.st-al i{background:var(--alerta)}.st-cr i{background:var(--critico)}.st-nd i{background:var(--n1);color:var(--tinta)}
.seta-b{color:var(--ok)}.seta-r{color:var(--critico)}
.h24{display:flex;gap:2px;height:28px;margin:4px 0 12px}
.h24 div{border-radius:4px;min-width:2px;color:#0A4250;font-size:12.5px;font-weight:600;padding:5px 7px;overflow:visible;white-space:nowrap}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--tinta2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.leg b{color:var(--tinta);font-weight:600}
.maqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.maq{border:1px solid var(--borda);border-radius:8px;padding:9px 11px}
.maq .cod{font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.maq .nome{font-size:12px;color:var(--mudo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maq .v{font-size:21px;font-weight:600;margin-top:4px}
.medidor{height:6px;border-radius:3px;background:var(--n2);margin-top:5px;position:relative}
.medidor b{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--s1)}
.medidor u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta)}
.bh{display:grid;grid-template-columns:minmax(90px,var(--rot,34%)) minmax(0,1fr) auto;gap:5px 10px;align-items:center;font-size:13.5px}
.bh .r{color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh .t{position:relative;height:16px}
.bh .t b{position:absolute;left:0;top:1px;bottom:1px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bh .t u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta);opacity:.75}
.bh .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bh .n small{color:var(--mudo);margin-left:6px}
.nota{font-size:12.5px;color:var(--mudo);margin-top:10px}
svg{display:block;width:100%;overflow:visible}
svg text{font-family:inherit;fill:var(--mudo);font-size:12px}
svg text{fill:var(--tinta2)}
svg .vt{fill:var(--tinta);font-size:12.5px;font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:600;text-align:left;color:var(--tinta2);border-bottom:1px solid var(--eixo);padding:6px 10px 6px 0;white-space:nowrap;font-size:13px}
td{border-bottom:1px solid var(--grade);padding:6px 10px 6px 0;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.fam td{font-weight:600;border-bottom:1px solid var(--eixo);padding-top:16px;font-size:14.5px}
td .f{color:var(--mudo);font-size:12.5px;display:block;max-width:46ch}
.dica{position:fixed;z-index:20;pointer-events:none;background:var(--tinta);color:#0A4250;padding:7px 10px;border-radius:6px;font-size:12.5px;line-height:1.4;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.dica b{font-weight:600}
.fluxo{display:grid;grid-template-columns:minmax(0,1.15fr) 28px minmax(0,1.5fr) 28px minmax(0,1fr);gap:0;align-items:stretch}
.fluxo .col{display:flex;flex-direction:column;gap:8px}
.fluxo h3{font-size:13.5px;font-weight:600;color:var(--tinta2);margin-bottom:2px}
.cx{border:1px solid var(--borda);border-left:4px solid var(--s1);border-radius:6px;padding:8px 10px;background:var(--n2)}
.cx b{display:block;font-weight:600;font-size:14px}
.cx span{font-size:12.5px;color:var(--tinta2)}
.cx.p{border-left-color:var(--fita)}.cx.s{border-left-color:var(--tinta)}
.seta{display:grid;place-items:center;color:var(--mudo);font-size:20px}
@media (max-width:820px){.fluxo{grid-template-columns:minmax(0,1fr)}.seta{transform:rotate(90deg);padding:4px}}
.cartao.tile{border-left:4px solid var(--n1)}
.erro{background:#fde8e8;color:#7a1414;padding:10px;border-radius:6px;font:13px monospace;white-space:pre-wrap}
@media (prefers-reduced-motion:no-preference){.bh .t b,.medidor b{transition:width .25s ease}}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div>
      <div class="marca">Moldara Embalagens</div>
      <h1>Performance do PCP</h1>
      <p>Fábrica de embalagens plásticas. Dados fictícios até <span id="corte"></span>.</p>
    </div>
    <div class="filtros">
      <div class="grupo">Mês<div class="seg" id="f-mes"></div></div>
      <div class="grupo">Escopo<div class="seg" id="f-esc"></div></div>
    </div>
  </div>
  <div class="fita"></div>
</header>
<nav class="abas"><div class="abas-in" id="abas" role="tablist"></div></nav>
<main id="conteudo"></main>
<div class="dica" id="dica" hidden></div>
<script>
const D = {"meses":[{"id":"2026-05","rotulo":"Mai/26"},{"id":"2026-06","rotulo":"Jun/26"},{"id":"2026-07","rotulo":"Jul/26"},{"id":"2026-08","rotulo":"Ago/26"},{"id":"2026-09","rotulo":"Set/26"},{"id":"2026-10","rotulo":"Out/26"}],"corte":"31/10/2026","maquinas":[{"id":"INJ-01","nome":"Injetora 180 t","cel":"Injeção"},{"id":"INJ-02","nome":"Injetora 180 t","cel":"Injeção"},{"id":"INJ-03","nome":"Injetora 250 t","cel":"Injeção"},{"id":"INJ-04","nome":"Injetora 250 t","cel":"Injeção"},{"id":"INJ-05","nome":"Injetora 350 t","cel":"Injeção"},{"id":"SOP-01","nome":"Sopradora 2 cavidades","cel":"Sopro"},{"id":"SOP-02","nome":"Sopradora 2 cavidades","cel":"Sopro"},{"id":"SOP-03","nome":"Sopradora 4 cavidades","cel":"Sopro"},{"id":"SOP-04","nome":"Sopradora de galões","cel":"Sopro"},{"id":"DEC-01","nome":"Serigrafia rotativa","cel":"Decoração"},{"id":"DEC-02","nome":"Serigrafia rotativa","cel":"Decoração"},{"id":"DEC-03","nome":"Rotuladora automática","cel":"Decoração"}],"catalogo":[{"id":"EFI01","fam":"Eficiência","nome":"OEE","un":"%","sentido":"maior","meta":0.75,"formula":"Disponibilidade x Performance x Qualidade","fonte":"Coletor (MES) + diário de bordo"},{"id":"EFI02","fam":"Eficiência","nome":"Disponibilidade","un":"%","sentido":"maior","meta":0.85,"formula":"Tempo produzindo / tempo programado (turno menos paradas planejadas)","fonte":"Coletor (MES) + diário de bordo"},{"id":"EFI03","fam":"Eficiência","nome":"Performance","un":"%","sentido":"maior","meta":0.92,"formula":"Tempo teórico das peças produzidas no ciclo padrão / tempo produzindo","fonte":"Coletor (MES) + roteiro do ERP"},{"id":"EFI04","fam":"Eficiência","nome":"Qualidade","un":"%","sentido":"maior","meta":0.98,"formula":"Peças boas / peças produzidas","fonte":"Coletor (MES)"},{"id":"EFI05","fam":"Eficiência","nome":"TEEP","un":"%","sentido":"maior","meta":0.5,"formula":"OEE x (tempo programado / tempo calendário de 24 h)","fonte":"Coletor (MES) + calendário"},{"id":"EFI06","fam":"Eficiência","nome":"Utilização da capacidade","un":"%","sentido":"maior","meta":0.65,"formula":"Tempo programado / tempo calendário","fonte":"Diário de bordo + calendário"},{"id":"EFI07","fam":"Eficiência","nome":"Produção boa","un":"mil pç","sentido":"maior","meta":null,"formula":"Peças produzidas menos refugo","fonte":"Coletor (MES)"},{"id":"EFI08","fam":"Eficiência","nome":"Produção transformada","un":"t","sentido":"maior","meta":null,"formula":"Peças boas de injeção e sopro x peso da peça","fonte":"Coletor (MES) + cadastro do ERP"},{"id":"EFI09","fam":"Eficiência","nome":"Desvio do ciclo padrão","un":"%","sentido":"menor","meta":0.08,"formula":"Tempo produzindo / tempo teórico no ciclo padrão - 1","fonte":"Coletor (MES) + roteiro do ERP"},{"id":"PLA01","fam":"Programação","nome":"Aderência ao programa (volume)","un":"%","sentido":"maior","meta":0.95,"formula":"Peças boas das ordens programadas / quantidade programada","fonte":"Programa semanal + coletor (MES)"},{"id":"PLA02","fam":"Programação","nome":"Aderência ao mix","un":"%","sentido":"maior","meta":0.9,"formula":"Soma do menor entre realizado e programado por dia e ordem / quantidade programada","fonte":"Programa semanal + coletor (MES)"},{"id":"PLA03","fam":"Programação","nome":"Aderência à sequência","un":"%","sentido":"maior","meta":0.9,"formula":"Ordens iniciadas na ordem do programa / ordens iniciadas","fonte":"Programa semanal + coletor (MES)"},{"id":"PLA04","fam":"Programação","nome":"Pontualidade das ordens","un":"%","sentido":"maior","meta":0.85,"formula":"Ordens encerradas até a data de fim programada / ordens com fim programado no mês","fonte":"ERP + coletor (MES)"},{"id":"PLA05","fam":"Programação","nome":"Carga sobre capacidade","un":"%","sentido":"menor","meta":0.85,"formula":"Horas-padrão programadas / horas programadas das máquinas","fonte":"Programa semanal + roteiro do ERP"},{"id":"ENT01","fam":"Entrega","nome":"OTIF","un":"%","sentido":"maior","meta":0.9,"formula":"Pedidos entregues no prazo e na quantidade / pedidos com data prometida no mês","fonte":"ERP (pedidos)"},{"id":"ENT02","fam":"Entrega","nome":"No prazo (On Time)","un":"%","sentido":"maior","meta":0.95,"formula":"Pedidos entregues até a data prometida / pedidos do mês","fonte":"ERP (pedidos)"},{"id":"ENT03","fam":"Entrega","nome":"Completo (In Full)","un":"%","sentido":"maior","meta":0.95,"formula":"Pedidos com quantidade entregue maior ou igual à pedida / pedidos do mês","fonte":"ERP (pedidos)"},{"id":"ENT04","fam":"Entrega","nome":"Atraso médio dos pedidos atrasados","un":"dias","sentido":"menor","meta":2.0,"formula":"Média de dias entre a data prometida e a entrega dos pedidos atrasados","fonte":"ERP (pedidos)"},{"id":"ENT05","fam":"Entrega","nome":"Ordens em atraso no fim do mês","un":"un","sentido":"menor","meta":5.0,"formula":"Ordens com data de necessidade vencida e ainda abertas no último dia do mês","fonte":"ERP + coletor (MES)"},{"id":"ENT06","fam":"Entrega","nome":"Lead time de produção","un":"dias","sentido":"menor","meta":3.0,"formula":"Média de dias entre o início e o fim real da ordem","fonte":"Coletor (MES)"},{"id":"ENT07","fam":"Entrega","nome":"Lead time do pedido","un":"dias","sentido":"menor","meta":15.0,"formula":"Média de dias entre a data do pedido e a entrega","fonte":"ERP (pedidos)"},{"id":"QUA01","fam":"Qualidade","nome":"Refugo","un":"%","sentido":"menor","meta":0.025,"formula":"Peças refugadas / peças produzidas","fonte":"Coletor (MES)"},{"id":"QUA02","fam":"Qualidade","nome":"Retrabalho","un":"%","sentido":"menor","meta":0.01,"formula":"Peças retrabalhadas / peças produzidas","fonte":"Coletor (MES)"},{"id":"QUA03","fam":"Qualidade","nome":"FPY (aprovação de primeira)","un":"%","sentido":"maior","meta":0.965,"formula":"Peças boas sem retrabalho / peças produzidas","fonte":"Coletor (MES)"},{"id":"QUA04","fam":"Qualidade","nome":"Refugo em PPM","un":"ppm","sentido":"menor","meta":25000.0,"formula":"Peças refugadas por milhão de peças produzidas","fonte":"Coletor (MES)"},{"id":"QUA05","f function tile(cod) {
  const c = CAT[cod], [v, st] = K(cod), serie = D.meses.map(m => K(cod, m.id)[0]);
  const bc = {"No alvo": "var(--ok)", "Atenção": "var(--alerta)", "Crítico": "var(--critico)"}[st] || "var(--s1f)";
  return `<div class="cartao tile" style="border-left-color:${bc}"><div class="rot">${esc(c.nome)}</div>
    <div class="val">${fmt(v, c.un)}<small>${unTxt(c.un)}</small></div>
    <div class="delta">${delta(cod)}</div>
    <div class="pe"><div><div class="meta">${metaTxt(c)}</div>${chip(st)}</div>${spark(serie)}</div></div>`;
}
function cartao(titulo, sub, corpo, extra = "") {
  return `<section class="cartao" ${extra}><h2>${titulo}</h2><p class="sub">${sub}</p>${corpo}</section>`;
}
function graf(id, fn) { registrar(id, fn); return `<div id="${id}"></div>`; }
const diasDoMes = () => [...new Set(D.dia.filter(r => r.dia.startsWith(S.mes)).map(r => r.dia))];
const maqMes = (mes = S.mes) => D.maq_mes.filter(r => r.mes === mes && maqNoEsc(r.maq));
const corOEE = v => v >= .75 ? "No alvo" : v >= .675 ? "Atenção" : "Crítico";

/* ---------- abas ---------- */
function abaGeral() {
  const perdas = D.perdas.filter(r => r.mes === S.mes && maqNoEsc(r.maq));
  const porEtapa = D.etapas.map(e => ({...e, h: perdas.filter(p => p.o === e.o).reduce((a, p) => a + p.h, 0)}));
  const total = porEtapa.reduce((a, e) => a + e.h, 0);
  const cor = {"Produtivo": "var(--s1)", "Disponibilidade": "var(--s2)", "Performance": "var(--s4)", "Qualidade": "var(--s7)", "Fora da carga": "var(--n1)"};
  const ordem = [9, 8, 7, 3, 4, 5, 6, 2, 1].map(o => porEtapa.find(e => e.o === o)).filter(e => e.h > 0.5);
  const barra = `<div class="h24" role="img" aria-label="Divisão das horas de calendário">` + ordem.map(e => {
    const p = e.h / total;
    return `<div tabindex="0" style="flex:${e.h} 0 0;background:${cor[e.tipo]};${e.tipo === "Fora da carga" ? "color:var(--tinta)" : ""}" data-dica="<b>${e.nome}</b><br>${nf(e.h, 0)} h, ${pct(p)} do calendário<br>Perda de: ${e.tipo}">${p > 0.07 ? pct(p, 0) : ""}</div>`;
  }).join("") + `</div><div class="leg">` + ordem.map(e => `<span><i style="background:${cor[e.tipo]}"></i>${e.nome} <b>${nf(e.h, 0)} h</b></span>`).join("") + `</div>`;
  const maqs = maqMes().map(r => ({...r, ...oee(r)}));
  const andon = `<div class="maqs">` + maqs.map(m => `<div class="maq" tabindex="0" data-dica="<b>${m.maq} · ${esc(MAQ[m.maq].nome)}</b><br>Disponibilidade ${pct(m.d)}<br>Performance ${pct(m.p)}<br>Qualidade ${pct(m.q)}<br>Paradas não planejadas ${nf(m.np / 60, 0)} h">
      <div class="cod">${m.maq}${chip(corOEE(m.oee)).replace(/>(No alvo|Atenção|Crítico)</, "><")}</div><div class="nome">${esc(MAQ[m.maq].nome)}</div>
      <div class="v">${pct(m.oee)}</div><div class="medidor"><b style="width:${Math.min(100, m.oee * 100)}%"></b><u style="left:75%"></u></div></div>`).join("") + `</div><p class="nota">OEE do mês por máquina. A marca é a meta de 75%. Passe o cursor para ver disponibilidade, performance e qualidade.</p>`;
  const dias = diasDoMes();
  const serie = dias.map(d => { const o = soma(D.dia.filter(r => r.dia === d && noEsc(r.cel)), ["prog","run","teo","tot","boa"]); return o.prog ? oee(o).oee * 100 : null; });
  return `<div class="linha c6">${["EFI01","PLA02","ENT01","QUA01","MAN02","MAT05"].map(tile).join("")}</div>
    <div class="linha">${cartao("Para onde foram as horas das máquinas", `As 24 horas de calendário de ${S.esc === "Fábrica" ? "todas as máquinas" : "máquinas da " + S.esc} em ${MESROT[S.mes]}: o que virou peça boa e o que se perdeu no caminho.`, barra)}</div>
    <div class="linha c21">${cartao("OEE por dia", `Eficiência global das máquinas em cada dia de ${MESROT[S.mes]}, contra a meta de 75%.`, graf("g-oee-dia", linhas(dias.map(d => d.slice(8)), [{nome: "OEE", cor: "var(--s1)", vals: serie}], {meta: 75, fmt: v => nf(v, 0) + "%", un: "%", titulo: "OEE por dia"})))}
      ${cartao("OEE nos últimos meses", "O mês selecionado aparece em destaque.", graf("g-oee-mes", colunas("EFI01")))}</div>
    <div class="linha">${cartao("Máquinas", "Situação de cada máquina no mês.", andon)}</div>`;
}

function abaEfic() {
  const maqs = maqMes().map(r => ({...r, ...oee(r)})).sort((a, b) => b.oee - a.oee);
  const turnos = [1, 2, 3].map(t => { const o = soma(D.turno.filter(r => r.mes === S.mes && r.turno === t && noEsc(r.cel)), ["prog","run","teo","tot","boa"]); return {r: t + "º turno", ...oee(o)}; });
  const prods = [...grupo(D.produtos.filter(r => r.mes === S.mes && noEsc(r.cel)), r => r.produto)].map(([p, rs]) => { const o = soma(rs, ["tot","boa","ref","run","teo"]); return {p, cel: rs[0].cel, ...o}; }).sort((a, b) => b.boa - a.boa);
  const tab = `<div class="tw"><table><thead><tr><th>Máquina</th><th class="num">Disponibilidade</th><th class="num">Performance</th><th class="num">Qualidade</th><th class="num">OEE</th><th>Situação</th></tr></thead><tbody>` +
    maqs.map(m => `<tr><td>${m.maq} <span style="color:var(--mudo)">${esc(MAQ[m.maq].nome)}</span></td><td class="num">${pct(m.d)}</td><td class="num">${pct(m.p)}</td><td class="num">${pct(m.q)}</td><td class="num"><b>${pct(m.oee)}</b></td><td>${chip(corOEE(m.oee))}</td></tr>`).join("") + `</tbody></table></div>`;
  const tabP = `<div class="tw"><table><thead><tr><th>Produto</th><th class="num">Peças boas</th><th class="num">Performance</th><th class="num">Refugo</th></tr></thead><tbody>` +
    prods.map(p => `<tr><td>${esc(p.p)}</td><td class="num">${nf(p.boa, 0)}</td><td class="num">${pct(p.teo / p.run)}</td><td class="num">${pct(p.ref / p.tot, 2)}</td></tr>`).join("") + `</tbody></table></div>`;
  return `<div class="linha c4">${["EFI01","EFI02","EFI03","EFI04"].map(tile).join("")}</div>
    <div class="linha c3">${cartao("Disponibilidade", "Tempo produzindo sobre o tempo programado.", graf("g-e1", colunas("EFI02", 190)))}
      ${cartao("Performance", "Ritmo real contra o ciclo padrão do roteiro.", graf("g-e2", colunas("EFI03", 190)))}
      ${cartao("Qualidade", "Peças boas sobre peças produzidas.", graf("g-e3", colunas("EFI04", 190)))}</div>
    <div class="linha c21">${cartao("OEE por máquina", `Da melhor para a pior em ${MESROT[S.mes]}.`, barrasH(maqs.map(m => ({r: m.maq + "  " + MAQ[m.maq].nome, v: m.oee})), {fmt: pct, meta: .75, max: 1, nome: "OEE", rot: "38%"}))}
      ${cartao("OEE por turno", "O mesmo parque de máquinas, três equipes.", barrasH(turnos.map(t => ({r: t.r, v: t.oee, d: `Disp. ${pct(t.d)} · Perf. ${pct(t.p)} · Qual. ${pct(t.q)}`})), {fmt: pct, meta: .75, max: 1, nome: "OEE", rot: "24%"}))}</div>
    <div class="linha c2">${cartao("Os três fatores por máquina", "OEE = disponibilidade × performance × qualidade.", tab)}
      ${cartao("Produtos", "Volume, ritmo e refugo de cada produto no mês.", tabP)}</div>
    <div class="linha c4">${["EFI05","EFI06","EFI08","EFI09"].map(tile).join("")}</div>`;
}

function abaProg() {
  const dias = diasDoMes();
  const pd = dias.map(d => soma(D.prog_dia.filter(r => r.dia === d && noEsc(r.cel)), ["hp","hr","ha"]));
  const pm = D.prog_maq.filter(r => r.mes === S.mes && maqNoEsc(r.maq)).map(r => ({r: r.maq + "  " + MAQ[r.maq].nome, v: r.qa / r.qp, d: `Volume realizado: ${pct(r.qr / r.qp)} do programado`})).sort((a, b) => b.v - a.v);
  const cli = [...grupo(D.clientes.filter(r => r.mes === S.mes && noEsc(r.cel)), r => r.cliente)].map(([c, rs]) => { const o = soma(rs, ["n","otif","ot","inf"]); return {r: c, v: o.otif / o.n, x: o.n + " ped.", d: `No prazo ${pct(o.ot / o.n, 0)} · Completo ${pct(o.inf / o.n, 0)}`}; }).sort((a, b) => b.v - a.v);
  const atr = D.atrasados.filter(r => r.mes === S.mes && noEsc(r.cel)).slice(0, 12);
  const tab = atr.length ? `<div class="tw"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Produto</th><th>Máquina</th><th>Prometido</th><th>Entregue</th><th class="num">Atraso</th><th class="num">Entregue / pedido</th></tr></thead><tbody>` +
    atr.map(a => `<tr><td>${a.pedido}</td><td>${esc(a.cliente)}</td><td>${esc(a.produto)}</td><td>${a.maq || ""}</td><td>${a.prometida}</td><td>${a.entrega}</td><td class="num">${a.dias ? a.dias + " d" : "no prazo"}</td><td class="num">${pct(a.entregue / a.pedida, 0)}</td></tr>`).join("") + `</tbody></table></div>` : `<p class="nota">Nenhum pedido fora do OTIF neste recorte.</p>`;

    <div class="linha">${cartao("Programado e realizado por dia", `Horas-padrão de produção em ${MESROT[S.mes]}: o que o PCP programou e o que a fábrica entregou de peça boa. Horas-padrão permitem somar tampas e galões na mesma régua.`, graf("g-prog", linhas(dias.map(d => d.slice(8)), [{nome: "Programado", cor: "var(--s2)", vals: pd.map(o => o.hp || null)}, {nome: "Realizado", cor: "var(--s1)", vals: pd.map(o => o.hr || null)}], {zero: true, fmt: v => nf(v, 0), un: " h", titulo: "Programado e realizado"})))}</div>
    <div class="linha c2">${cartao("Aderência ao mix por máquina", "Parte do programa cumprida na ordem e no dia combinados.", barrasH(pm, {fmt: pct, meta: .9, max: 1, nome: "Aderência ao mix", rot: "40%"}))}
      ${cartao("OTIF por cliente", "Pedidos entregues no prazo e completos, pela data prometida.", cli.length ? barrasH(cli, {fmt: v => pct(v, 0), meta: .9, max: 1, nome: "OTIF", rot: "44%"}) : `<p class="nota">Sem pedidos neste recorte.</p>`)}</div>
    <div class="linha c4">${["ENT01","ENT02","ENT03","ENT05"].map(tile).join("")}</div>
    <div class="linha c21">${cartao("Pedidos fora do OTIF", "Os mais atrasados e os mais incompletos do mês.", tab)}
      ${cartao("OTIF nos últimos meses", "Meta de 90%.", graf("g-otif", colunas("ENT01")))}</div>
    <div class="linha c4">${["ENT04","ENT06","ENT07","PLA05"].map(tile).join("")}</div>`;
}

function pareto(rows, chave, val, f, nome) {
  const g = [...grupo(rows, chave)].map(([k, rs]) => ({r: k, v: rs.reduce((a, r) => a + r[val], 0), rs})).sort((a, b) => b.v - a.v);
  const tot = g.reduce((a, r) => a + r.v, 0); let ac = 0;
  g.forEach(r => { ac += r.v; r.x = pct(ac / tot, 0) + " acum."; r.d = pct(r.v / tot) + " do total"; });
  return {g, tot, html: barrasH(g, {fmt: f, nome, rot: "40%"})};
}
function abaQual() {
  const def = pareto(D.defeitos.filter(r => r.mes === S.mes && noEsc(r.cel)), r => r.defeito, "qtd", v => nf(v, 0), "Peças refugadas:");
  const maqs = maqMes().map(r => ({r: r.maq + "  " + MAQ[r.maq].nome, v: r.ref / r.tot, d: `Custo do refugo R$ ${compacto(r.cref)}`})).sort((a, b) => b.v - a.v);
  const prods = [...grupo(D.produtos.filter(r => r.mes === S.mes && noEsc(r.cel)), r => r.produto)].map(([p, rs]) => ({p, ...soma(rs, ["tot","ref","cref"])})).sort((a, b) => b.cref - a.cref);

      ${cartao("Refugo por máquina", "Percentual de peças refugadas sobre as produzidas.", barrasH(maqs, {fmt: v => pct(v, 2), meta: .025, nome: "Refugo", rot: "40%"}))}</div>

function abaPar() {
  const rows = D.paradas.filter(r => r.mes === S.mes && noEsc(r.cel));

  const tab = `<div class="tw"><table><thead><tr><th>Máquina</th><th class="num">Quebras</th><th class="num">MTBF (h)</th><th class="num">MTTR (min)</th><th class="num">Parada não planejada</th></tr></thead><tbody>` + maqs.map(m => `<tr><td>${m.maq} <span style="color:var(--mudo)">${esc(MAQ[m.maq].nome)}</span></td><td class="num">${nf(m.nq, 0)}</td><td class="num">${nf(m.mtbf, 1)}</td><td class="num">${nf(m.mttr, 0)}</td><td class="num">${nf(m.np, 0)} h (${pct(m.pnp)})</td></tr>`).join("") + `</tbody></table></div>`;
  return `<div class="linha c4">${["MAN02","MAN03","MAN04","MAN05"].map(tile).join("")}</div>
    <div class="linha c2">${cartao("Motivos de parada", `Horas de parada não planejada em ${MESROT[S.mes]}, com o acumulado ao lado.`, mot.html + `<p class="nota">O motivo vem do texto digitado no diário de bordo, padronizado por um de-para.</p>`)}
      ${cartao("Paradas por categoria", "Quem é o dono de cada bloco de horas.", cat.html)}</div>

function abaMat() {

  const prev = [...grupo(D.previsao.filter(r => r.mes === S.mes && noEsc(r.cel)), r => r.produto)].map(([p, rs]) => ({p, ...soma(rs, ["prev","ped"])}));
  const tabP = `<div class="tw"><table><thead><tr><th>Produto</th><th class="num">Previsto</th><th class="num">Pedido</th><th class="num">Desvio</th></tr></thead><tbody>` + prev.map(p => `<tr><td>${esc(p.p)}</td><td class="num">${nf(p.prev, 0)}</td><td class="num">${nf(p.ped, 0)}</td><td class="num">${p.ped ? (p.prev >= p.ped ? "+" : "") + nf((p.prev / p.ped - 1) * 100, 0) + "%" : "–"}</td></tr>`).join("") + `</tbody></table></div>`;
  const tur = [1, 2, 3].map(t => { const o = soma(D.pessoas.filter(r => r.mes === S.mes && r.turno === t && noEsc(r.cel)), ["hh","he","aus","quadro"]); return {t, ...o}; });

      ${cartao("Cobertura de matéria-prima", "Dias de consumo que o estoque médio aguenta. Fábrica toda.", barrasH(cob, {fmt: v => nf(v, 1) + " d", meta: 15, nome: "Cobertura", rot: "46%"}))}</div>

    <div class="linha c4">${["MAT04","MAT06","PES01","DEM01"].map(tile).join("")}</div>`;
}

function abaInd() {
  let fam = "", n = 0, alvo = 0, linhasT = "";
  D.catalogo.forEach(c => {
    const [v, st] = K(c.id);
    if (c.fam !== fam) { fam = c.fam; linhasT += `<tr class="fam"><td colspan="6">${esc(fam)}</td></tr>`; }
    if (v != null) { n++; if (st === "No alvo") alvo++; }
    linhasT += `<tr><td>${esc(c.nome)}<span class="f">${esc(c.formula)}</span></td><td class="num"><b>${fmt(v, c.un)}</b> ${unTxt(c.un)}</td><td class="num">${c.meta == null ? "–" : (c.sentido === "maior" ? "≥ " : c.sentido === "menor" ? "≤ " : "± ") + fmt(c.meta, c.un)}</td><td>${v == null ? `<span class="f">só para a fábrica</span>` : chip(st)}</td><td>${spark(D.meses.map(m => K(c.id, m.id)[0]))}</td><td><span class="f" style="color:var(--tinta2)">${esc(c.fonte)}</span></td></tr>`;
  });
  const comMeta = D.catalogo.filter(c => c.meta != null && K(c.id)[0] != null).length;
  return cartao(`${D.catalogo.length} indicadores do PCP`, `${MESROT[S.mes]}, ${S.esc}. ${alvo} de ${comMeta} indicadores com meta estão no alvo. Cada linha traz a fórmula e a origem do dado. A linha de tendência cobre os ${D.meses.length} meses, com o mês selecionado marcado.`,
    `<div class="tw"><table><thead><tr><th>Indicador e fórmula</th><th class="num">Valor</th><th class="num">Meta</th><th>Situação</th><th>Tendência</th><th>Origem</th></tr></thead><tbody>${linhasT}</tbody></table></div>`);
}

    <div class="col"><h3>Onde o dado nasce</h3>${origens.map(o => `<div class="cx"><b>${o[0]}</b><span>${o[2]} · ${o[3]}</span></div>`).join("")}</div>
    <div class="seta" aria-hidden="true">›</div>
    <div class="col"><h3>O que o pipeline faz, nesta ordem</h3>
      <div class="cx p"><b>1. Ingestão</b><span>Carrega tudo no DuckDB como veio. As planilhas são lidas pelo nome das colunas, então título e coluna nova não quebram a carga.</span></div>
      <div class="cx p"><b>2. Regras de negócio</b><span>Um arquivo SQL por regra: remove repetição do coletor, padroniza o motivo de parada, monta o turno, rateia o refugo, cruza programa e realizado, calcula OTIF e estoque em processo.</span></div>
      <div class="cx p"><b>3. Indicadores</b><span>${D.catalogo.length} indicadores por mês, para a fábrica e por célula, sempre somando numerador e denominador antes de dividir.</span></div>
      <div class="cx p"><b>4. Validação</b><span>O pipeline só termina se os números fecham: OEE igual ao produto dos três fatores, perdas somando o calendário, refugo por defeito igual ao do contador.</span></div></div>
    <div class="seta" aria-hidden="true">›</div>
    <div class="col"><h3>Onde o dado é lido</h3>
      <div class="cx s"><b>Arquivos Parquet</b><span>Uma camada de consumo só, para os dois painéis.</span></div>
      <div class="cx s"><b>Power BI</b><span>Relatório em PBIP, versionável no Git, para análise e filtro livre.</span></div>
      <div class="cx s"><b>Este painel HTML</b><span>Um arquivo estático, abre no celular e no telão da fábrica, sem licença e sem servidor.</span></div></div></div>`;
  const tabO = `<div class="tw"><table><thead><tr><th>Origem</th><th>O que entrega</th><th>Formato</th><th>Quem alimenta</th><th>Frequência</th></tr></thead><tbody>${origens.map(o => `<tr>${o.map((c, i) => `<td>${i ? c : "<b>" + c + "</b>"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const tabQ = `<div class="tw"><table><thead><tr><th>Checagem</th><th>Origem</th><th class="num">Registros</th><th class="num">do total</th><th>O que o pipeline faz</th></tr></thead><tbody>${D.dq.map(q => `<tr><td>${esc(q.checagem)}</td><td>${esc(q.origem)}</td><td class="num">${nf(q.n, 0)}</td><td class="num">${pct(q.n / q.total)}</td><td>${esc(q.tratamento)}</td></tr>`).join("")}</tbody></table></div>`;
  return `<div class="linha">${cartao("Do chão de fábrica ao painel", "O caminho de cada número: cinco origens, um pipeline em quatro etapas e dois painéis lendo a mesma camada.", fluxo)}</div>
    <div class="linha">${cartao("As cinco origens", `Período inteiro: ${nf(v.apontamentos, 0)} apontamentos de produção, ${nf(v.paradas, 0)} paradas, ${nf(v.ordens, 0)} ordens e ${nf(v.pedidos, 0)} pedidos.`, tabO)}</div>
    <div class="linha">${cartao("Qualidade da coleta", "Antes de confiar no indicador, medir a coleta. O que apareceu de errado nos dados e como foi tratado.", tabQ)}</div>`;
}

const RENDER = {geral: abaGeral, efic: abaEfic, prog: abaProg, qual: abaQual, par: abaPar, mat: abaMat, ind: abaInd, coleta: abaColeta};

function botoes(el, itens, atual, attr, aoClicar) {
  el.innerHTML = itens.map(([id, rot]) => `<button type="button" ${attr}="${id === atual}" data-id="${id}"${attr === "aria-selected" ? ' role="tab"' : ""}>${rot}</button>`).join("");
  el.onclick = ev => { const b = ev.target.closest("button"); if (b) aoClicar(b.dataset.id); };
}
function render() {
  graficos = [];
  botoes($("#f-mes"), D.meses.map(m => [m.id, m.rotulo]), S.mes, "aria-pressed", id => { S.mes = id; render(); });
  botoes($("#f-esc"), ESCOPOS.map(e => [e, e]), S.esc, "aria-pressed", id => { S.esc = id; render(); });
  botoes($("#abas"), ABAS, S.aba, "aria-selected", id => { S.aba = id; render(); scrollTo(0, 0); });
  try { $("#conteudo").innerHTML = RENDER[S.aba](); desenhar(); }
  catch (e) { $("#conteudo").innerHTML = `<div class="erro">${esc(e.stack || e)}</div>`; }
  history.replaceState(null, "", `#aba=${S.aba}&mes=${S.mes}&esc=${encodeURIComponent(S.esc)}`);
}
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => {
  if (k === "aba" && RENDER[v]) S.aba = v;
  if (k === "mes" && MESROT[v]) S.mes = v;
  if (k === "esc" && ESCOPOS.includes(v)) S.esc = v;
});
$("#corte").textContent = D.corte;
let tRes; addEventListener("resize", () => { clearTimeout(tRes); tRes = setTimeout(desenhar, 120); });
render();
</script>
</body>
</html>
